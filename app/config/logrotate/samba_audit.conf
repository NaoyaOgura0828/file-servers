/var/log/samba/audit.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0640 syslog adm
    sharedscripts
    postrotate
        # rsyslog にファイル再オープンを通知 (Ubuntu 標準ヘルパ優先、無ければ HUP)
        if [ -x /usr/lib/rsyslog/rsyslog-rotate ]; then
            /usr/lib/rsyslog/rsyslog-rotate
        else
            /bin/systemctl kill -s HUP rsyslog.service >/dev/null 2>&1 || true
        fi
    endscript
    # CloudWatch Agent はローテーション (truncate/再作成) を自動検知するため通知不要
}
