# Crontab 設定 - サンプル
# このファイルをコピーして、各サーバー用の設定ファイルを作成する。
# 例: cp sample.conf FileServer.conf
#
# app/setup/crontab.sh が source で読み込み、/etc/cron.d/${CRON_FILENAME} を配置する。

# /etc/cron.d/ 配下のファイル名 (英数字とハイフンのみ、ドット禁止)
CRON_FILENAME=""                         # 例: fileserver

# /etc/cron.d/ に書き込む本文 (システム crontab フォーマット)
# 形式: "分 時 日 月 曜日 ユーザー コマンド"
# 行頭 # コメント可、空行可。SHELL/PATH 等の環境変数も指定可。
CRON_BODY=""

# ===== 使用例 =====
#
# 例 1: rsync を毎時 0 分に root 権限で実行 (FileServer)
#   CRON_FILENAME="fileserver"
#   CRON_BODY='
#   SHELL=/bin/bash
#   PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
#
#   # /mnt/fileserver -> /mnt/fileserver-backup を毎時 0 分に rsync
#   0 * * * * root /home/NaoyaOgura/file-servers/app/jobs/rsync_fileserver.sh
#   '
