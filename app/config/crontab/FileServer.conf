# Crontab 設定 - FileServer
# app/setup/crontab.sh が source して /etc/cron.d/${CRON_FILENAME} を配置する。

CRON_FILENAME="fileserver"

CRON_BODY='
SHELL=/bin/bash
PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin

# 毎時 0 分: 通常 rsync (mtime + size 比較で高速同期)
# (rsync_fileserver.sh は内部で require_root + flock 排他、ログは /var/log/rsync/rsync_fileserver.log)
#
# 注意: --checksum は 100TB 規模で I/O 過大なため定期実行しない。
#       スクリプト自体は手動オプションとして --checksum / --dry-run を受け付けるので、
#       破損が疑われた場合のみスポット検査として手動で実行する運用とする。
0 * * * * root /home/NaoyaOgura/file-servers/app/jobs/rsync_fileserver.sh
'
