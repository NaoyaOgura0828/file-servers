# OS 初期化設定 - サンプル
# このファイルをコピーして、各サーバー用の設定ファイルを作成する。
# 例: cp sample.conf BackupServer.conf

# ホスト名 (hostnamectl set-hostname)
HOSTNAME=""                                              # 例: BackupServer / FileServer

# タイムゾーン
TIMEZONE="Asia/Tokyo"

# ロケール (locale-gen + update-locale)
LOCALE="ja_JP.UTF-8"

# 追加でインストールするパッケージ (空白区切り、空文字なら何も入れない)
EXTRA_PACKAGES="curl wget jq vim git unzip ca-certificates"

# unattended-upgrades (セキュリティアップデート自動適用)
ENABLE_UNATTENDED_UPGRADES="yes"
