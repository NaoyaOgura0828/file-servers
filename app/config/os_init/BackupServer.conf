# OS 初期化設定 - BackupServer (Ubuntu 26.04)
# app/setup/os_init.sh が source して読み込む。

HOSTNAME="BackupServer"
TIMEZONE="Asia/Tokyo"
LOCALE="ja_JP.UTF-8"

# 追加でインストールするパッケージ (空白区切り、空文字なら何も入れない)
EXTRA_PACKAGES="curl wget jq vim git unzip ca-certificates util-linux-extra"

# unattended-upgrades (セキュリティアップデート自動適用) を有効化するか
ENABLE_UNATTENDED_UPGRADES="yes"
