# ストレージ (LVM) 設定 - サンプル
# このファイルをコピーして、各サーバー用の設定ファイルを作成する。
# 例: cp sample.conf BackupServer.conf
#
# storage.sh は「既存 LVM ボリュームの検出・アクティベート・/etc/fstab 登録・mount」を行う。
# 新規 PV/VG/LV 作成およびフォーマットは安全のため自動化していない (手順は本ファイル末尾参照)。

# ----- 認識対象 -----
VG_NAME=""                           # ボリュームグループ名 (例: timemachine-group)
LV_NAME=""                           # 論理ボリューム名 (例: timemachine)
MOUNT_POINT=""                       # マウント先 (例: /mnt/timemachine)
FILESYSTEM="xfs"                     # 本プロジェクトの標準は xfs (Ubuntu 上でも xfs 運用)。
                                      # 既存ディスクを移設する場合は実機の TYPE 値に合わせる
                                      # (blkid / lsblk -f で確認、storage.sh も実行時に照合する)。
MOUNT_OPTIONS="defaults,noatime"     # /etc/fstab 用オプション

# ===== 新規 LVM ボリュームを作成する場合 =====
# storage.sh は本処理を実行しない (検出・マウント専用)。新規作成は次のコマンドで:
#
#   sudo app/setup/lvm_create.sh /dev/sdX timemachine-group timemachine
#
# (一括で pvcreate → vgcreate → lvcreate → mkfs.xfs まで実行する。
#  追加ディスクで容量拡張するなら lvm_extend.sh を使う)
#
# 上記後に本スクリプト (storage.sh) を実行すれば認識・mount まで自動で行える。
