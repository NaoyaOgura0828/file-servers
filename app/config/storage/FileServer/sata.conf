# ストレージ (LVM) 設定 - FileServer / SATA 接続側
# app/setup/storage.sh が source して読み込む。
#
# ⚠️ プレースホルダ <...> は実 FileServer 上で実値に変更すること。
#    実値は当該サーバーで `sudo lsblk -f` / `sudo vgs` / `sudo lvs` を実行して取得する。
#
# 想定: 内蔵 SATA HDD × 13 を 1 つの VG に pooling した LV。
# 内蔵接続のため boot 時に確実に enumerate される → device-timeout は不要。
# nofail のみ付けて「万一どれかの PV が脱落しても boot 自体は継続」させる。

VG_NAME="<sata-vg-name>"             # 例: fileserver-sata-group
LV_NAME="<sata-lv-name>"             # 例: fileserver-sata
MOUNT_POINT="<mount-point>"          # 例: /mnt/fileserver-sata
FILESYSTEM="xfs"                     # プロジェクト標準
MOUNT_OPTIONS="defaults,noatime,nofail"
