# ストレージ (LVM) 設定 - FileServer / USB 接続側
# app/setup/storage.sh が source して読み込む。
#
# ⚠️ プレースホルダ <...> は実 FileServer 上で実値に変更すること。
#    実値は当該サーバーで `sudo lsblk -f` / `sudo vgs` / `sudo lvs` を実行して取得する。
#
# 想定: USB 接続 HDD × 15 を 1 つの VG に pooling した LV。
# USB hub の power-on cascade + 15 台の serial enumerate + LVM activation で
# 60〜90 秒は十分にかかり得るため、x-systemd.device-timeout は **120 秒**を採用。
# nofail で「USB が間に合わなくても boot を継続」、必要なら起動後に手動 mount する。

VG_NAME="<usb-vg-name>"              # 例: fileserver-usb-group
LV_NAME="<usb-lv-name>"              # 例: fileserver-usb
MOUNT_POINT="<mount-point>"          # 例: /mnt/fileserver-usb
FILESYSTEM="xfs"                     # プロジェクト標準
MOUNT_OPTIONS="defaults,noatime,nofail,x-systemd.device-timeout=120s"
