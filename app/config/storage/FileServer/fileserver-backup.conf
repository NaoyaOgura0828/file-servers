# ストレージ (LVM) 設定 - FileServer / バックアップ (USB 接続プール)
# app/setup/storage.sh が source して読み込む。
#
# 想定: USB 接続 HDD × 29 を 1 つの VG に pooling した LV (VSize 約 104 TiB)。
# /mnt/fileserver から rsync (app/jobs/rsync_fileserver.sh) で同期する複製先。
# USB hub の power-on cascade + 多台数の serial enumerate + LVM activation で
# 60〜90 秒は十分にかかり得るため、x-systemd.device-timeout は **120 秒**を採用。
# ※ 120s は当初 USB-HDD 15 台想定で決定。現行 29 台でも稼働実績はあるが、
#   さらに台数追加する場合は boot 時の enumerate 完了時間を再測定して値を見直すこと
#   (詳細は docs/decisions/ADR-005-udev-late-mount.md)。
# nofail で「USB が間に合わなくても boot を継続」、必要なら起動後に手動 mount する
# (もしくは app/setup/auto_mount.sh で late-mount を設定する)。

VG_NAME="fileserver-backup-group"
LV_NAME="fileserver-backup"
MOUNT_POINT="/mnt/fileserver-backup"
FILESYSTEM="xfs"                     # プロジェクト標準
MOUNT_OPTIONS="defaults,noatime,nofail,x-systemd.device-timeout=120s"
