# ストレージ (LVM) 設定 - BackupServer
# app/setup/storage.sh が source して読み込む。
#
# 実機 (旧 RHEL/Rocky 系) からディスクを移設して Ubuntu 26.04 で認識する想定。
# 新規作成は範囲外 (storage.sh はフォーマットを行わない)。

# 認識対象の VG / LV / マウント先
VG_NAME="timemachine-group"          # 実機の VG 名 (lsblk -f / vgs で確認)
LV_NAME="timemachine"                # 実機の LV 名
MOUNT_POINT="/mnt/timemachine"
FILESYSTEM="xfs"                     # 旧 RHEL/Rocky 系のデフォルト
# /etc/fstab 用オプション。USB 接続ストレージのため nofail + device-timeout を付与:
#   nofail                    デバイス未検出時に boot を失敗させずスキップ (emergency mode 回避)
#   x-systemd.device-timeout  デバイス出現待ち時間 (デフォルト 90s → 30s に短縮)
MOUNT_OPTIONS="defaults,noatime,nofail,x-systemd.device-timeout=30s"
