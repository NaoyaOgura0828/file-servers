# Network 設定 - BackupServer (Ubuntu 26.04 / NetworkManager)
# app/setup/network.sh が source して読み込む。
#
# WIFI_PASSWORD は本ファイルに **書かない**。次のいずれかで渡す:
#   - 対話プロンプト (推奨、network.sh が read -s で取得)
#   - 環境変数 WIFI_PASSWORD
#   - --password-file <path> 引数 (gitignore 必須)

# ----- Ethernet (検出された全ての有線 NIC に一律適用) -----
ETHERNET_ROUTE_METRIC="10"           # 数値が小さいほど優先
ETHERNET_AUTOCONNECT="yes"

# ----- Wi-Fi (WIFI_SSID が空なら Wi-Fi 設定をスキップ) -----
WIFI_INTERFACE=""                    # 空文字 = nmcli auto-detect (wlan0 / wlp3s0 等)
WIFI_SSID="Kure Naval District"
WIFI_ROUTE_METRIC="50"               # ETHERNET_ROUTE_METRIC より大きい値で fallback 扱い
WIFI_AUTOCONNECT="yes"
