# Network 設定 - サンプル
# このファイルをコピーして、各サーバー用の設定ファイルを作成する。
# 例: cp sample.conf BackupServer.conf
#
# WIFI_PASSWORD は本ファイルに **書かない** (機密のため)。次のいずれかで渡す:
#   - 対話プロンプト (推奨、network.sh が read -s で取得)
#   - 環境変数 WIFI_PASSWORD
#   - --password-file <path> 引数 (gitignore 必須)

# ----- Ethernet (検出された全ての有線 NIC に一律適用) -----
ETHERNET_ROUTE_METRIC="10"           # ipv4/ipv6 route-metric (小さいほど優先)
ETHERNET_AUTOCONNECT="yes"           # yes / no

# ----- Wi-Fi (WIFI_SSID が空なら Wi-Fi 設定をスキップ) -----
WIFI_INTERFACE=""                    # 空文字 = nmcli auto-detect (wlan0 / wlp3s0 等)
                                      # 複数 Wi-Fi NIC があるときだけ明示する
WIFI_SSID=""                         # 例: "MyHomeNetwork"
WIFI_ROUTE_METRIC="50"               # ETHERNET_ROUTE_METRIC より大きい値で fallback 扱い
WIFI_AUTOCONNECT="yes"               # yes / no
