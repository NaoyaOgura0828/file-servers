# Samba 設定 - BackupServer (Time Machine 用)
# このファイルは app/setup/samba.sh が source して読み込む。

# ----- 識別情報 -----
SERVER_NAME="BackupServer"
NETBIOS_NAME="BACKUPSERVER"
WORKGROUP="WORKGROUP"
SERVER_STRING="Backup Server (Time Machine)"

# ----- 共有設定 -----
SHARE_NAME="timemachine"
SHARE_PATH="/mnt/timemachine"
SHARE_VALID_USER="NaoyaOgura"           # 既存 admin ユーザーをそのまま使用 (旧運用との互換性のため、Mac 側 SMB credential を変更しなくて済む)
SHARE_TIMEMACHINE_MAX_SIZE="2T"         # Time Machine 1 クライアントあたりの上限 (例: 1T / 2T / 500G)

# ----- アクセス制御 -----
HOSTS_ALLOW="192.168.0.0/16 127.0.0.1"  # 許可するソース (LAN セグメント)
INTERFACES=""                            # 空 = 全 NIC で待ち受け、特定 NIC 限定なら "eth0 lo"

# ----- 機能フラグ -----
ENABLE_AVAHI="yes"                       # mDNS による Mac クライアント自動検出
ENABLE_FRUIT="yes"                       # vfs_fruit (Time Machine 必須、SMB プロトコル拡張)
