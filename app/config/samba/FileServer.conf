# Samba 設定 - FileServer (一般ファイル共有)
# このファイルは app/setup/samba.sh が source して読み込む。

# ----- 識別情報 -----
SERVER_NAME="FileServer"
NETBIOS_NAME="FILESERVER"
WORKGROUP="WORKGROUP"
SERVER_STRING="File Server"

# ----- 共有設定 -----
# /mnt/fileserver-backup は rsync (app/jobs/rsync_fileserver.sh) のローカル複製先のため
# Samba 共有としては公開せず、プライマリの /mnt/fileserver のみ公開する。
SHARE_NAME="FileServer"
SHARE_PATH="/mnt/fileserver"
SHARE_VALID_USER="NaoyaOgura"           # 既存 admin ユーザーをそのまま使用 (旧運用との互換性のため、Mac 側 SMB credential を変更しなくて済む)
SHARE_TIMEMACHINE_MAX_SIZE=""           # Time Machine 用途ではないため空

# ----- アクセス制御 -----
HOSTS_ALLOW="192.168.0.0/16 127.0.0.1"  # 許可するソース (LAN セグメント)
INTERFACES=""                            # 空 = 全 NIC で待ち受け、特定 NIC 限定なら "eth0 lo"

# ----- 機能フラグ -----
ENABLE_AVAHI="yes"                       # mDNS による Mac クライアント自動検出
ENABLE_FRUIT="yes"                       # vfs_fruit (macOS の SMB 互換性向上)
ENABLE_AUDIT="yes"                       # vfs_full_audit で SMB アクセスログを /var/log/samba/audit.log に出力 (CloudWatch Logs へ転送)
