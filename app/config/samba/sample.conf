# Samba 設定ファイル - サンプル
# このファイルをコピーして、各サーバー用の設定ファイルを作成する。
# 例: cp sample.conf BackupServer.conf
#
# app/setup/samba.sh が source で読み込む形式の bash 変数定義。

# ===== 識別情報 =====
SERVER_NAME=""                           # 例: BackupServer / FileServer
NETBIOS_NAME=""                          # 大文字 15 文字以内推奨 (例: BACKUPSERVER)
WORKGROUP="WORKGROUP"                    # Windows / Mac ネットワーク上のワークグループ名
SERVER_STRING=""                         # 一覧表示用の説明文

# ===== 共有設定 =====
SHARE_NAME=""                            # 例: timemachine, public, data
SHARE_PATH=""                            # 例: /mnt/timemachine, /srv/samba/public
SHARE_VALID_USER=""                      # 共有アクセスを許可する Unix ユーザー (smbpasswd 登録対象)
SHARE_TIMEMACHINE_MAX_SIZE=""            # Time Machine 用途のときだけ設定。例: "2T". 未使用なら空 ""

# ===== アクセス制御 =====
HOSTS_ALLOW="192.168.0.0/16 127.0.0.1"  # 許可するソース (CIDR)
INTERFACES=""                            # 空 = 全 NIC、特定 NIC 限定なら "eth0 lo"

# ===== 機能フラグ =====
ENABLE_AVAHI="yes"                       # mDNS (avahi-daemon) で Mac から自動検出可能にする
ENABLE_FRUIT="yes"                       # vfs_fruit (Time Machine / macOS 互換性向上、必須)

# ===== 使用例 =====
#
# 例 1: Time Machine バックアップ用 (BackupServer)
#   SERVER_NAME="BackupServer"
#   NETBIOS_NAME="BACKUPSERVER"
#   SHARE_NAME="timemachine"
#   SHARE_PATH="/mnt/timemachine"
#   SHARE_VALID_USER="timemachine"
#   SHARE_TIMEMACHINE_MAX_SIZE="2T"
#   ENABLE_AVAHI="yes"
#   ENABLE_FRUIT="yes"
#
# 例 2: 一般ファイル共有 (FileServer)
#   SERVER_NAME="FileServer"
#   NETBIOS_NAME="FILESERVER"
#   SHARE_NAME="data"
#   SHARE_PATH="/mnt/fileserver"
#   SHARE_VALID_USER="fileuser"
#   SHARE_TIMEMACHINE_MAX_SIZE=""
#   ENABLE_AVAHI="no"
#   ENABLE_FRUIT="yes"
